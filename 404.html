<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#f5f5f7">
    <title>Page not found | ScopeXR</title>
    <meta name="description" content="The requested ScopeXR page could not be found.">
    <script
      src="https://cdn.telemetrydeck.com/websdk/telemetrydeck.min.js"
      data-app-id="31E41C24-6D03-4B71-98A6-127157CB85A0"
    ></script>
    <link rel="icon" href="/assets/app-icon.png">
    <style>
      :root {
        color-scheme: light;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --blue: #0071e3;
        --page: #f5f5f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      }

      main {
        display: grid;
        place-items: center;
        padding: 48px 24px;
        text-align: center;
      }

      .error-content {
        display: grid;
        justify-items: center;
        max-width: 780px;
      }

      img {
        width: 88px;
        height: 88px;
        margin-bottom: 34px;
        border-radius: 22px;
      }

      .eyebrow {
        margin: 0 0 17px;
        color: var(--blue);
        font-size: 17px;
        font-weight: 650;
      }

      h1 {
        margin: 0 0 26px;
        font-size: clamp(50px, 9vw, 92px);
        letter-spacing: -0.055em;
        line-height: 0.96;
      }

      .description {
        max-width: 620px;
        margin: 0 0 36px;
        color: var(--muted);
        font-size: clamp(20px, 3vw, 26px);
        line-height: 1.35;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .button {
        display: inline-block;
        padding: 13px 22px;
        border-radius: 999px;
        background: var(--blue);
        color: #fff;
        font-size: 17px;
        text-decoration: none;
      }

      .button-secondary {
        background: #e8e8ed;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="error-content">
        <img src="/assets/app-icon.png" alt="ScopeXR app icon" width="88" height="88">
        <p class="eyebrow">Error 404</p>
        <h1>Page not found.</h1>
        <p class="description">
          The page may have moved, or the address may be incorrect. You can return to
          ScopeXR or contact us for help.
        </p>
        <div class="actions">
          <a class="button" href="/">Return home</a>
          <a class="button button-secondary" href="mailto:support@scopexr.com">Contact ScopeXR</a>
        </div>
      </div>
    </main>
  </body>
</html>
